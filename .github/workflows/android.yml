name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies
        run: npm install

      - name: Create native Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Verify Android 16 target
        shell: bash
        run: |
          echo "Capacitor Android project variables:"
          cat android/variables.gradle
          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle

      - name: Build installable APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK download
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Lawn-Business-OS.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Lawn-Business-OS-Android-APK
          path: dist/Lawn-Business-OS.apk
          if-no-files-found: error
          retention-days: 30
